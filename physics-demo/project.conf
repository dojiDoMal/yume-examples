{
  // Cena inicial carregada no boot (nome do .scnb, resolvido relativo ao
  // diretório de trabalho — a pasta ao lado do executável, onde o build gravou
  // os artefatos).
  "scene": "scene.scnb",

  // Propriedades da janela.
  "window": {
    "title": "Physics Demo - cubo caindo no plano",
    "width": 1280,
    "height": 720
  },

  // Configuração do renderer, lida uma vez no boot.
  "renderer": {
    "api": "opengl",
    "srgb": false,
    "vsync": true
  }
}
