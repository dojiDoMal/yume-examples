{
  // Cena de entrada carregada no boot (nome do .scnb compilado, resolvido ao
  // lado do executável, que é o working dir).
  "scene": "scene.scnb",

  "window": {
    "title": "Pocket Creature - Sprite Animado",
    "width": 1280,
    "height": 720
  },

  // Ações de input mapeadas para as setas. keyhold = o estado é consultado por
  // frame (o script faz polling com Yume.InputSystem.isPressed).
  // Códigos de tecla seguem os nomes estilo JS.
  "input": {
    "aliases": [
      { "key": "up",    "value": "ArrowUp",    "eventType": "keyhold" },
      { "key": "down",  "value": "ArrowDown",  "eventType": "keyhold" },
      { "key": "left",  "value": "ArrowLeft",  "eventType": "keyhold" },
      { "key": "right", "value": "ArrowRight", "eventType": "keyhold" }
    ]
  },

  "renderer": {
    // Backend gráfico. Este exemplo foi validado no OpenGL (desktop).
    "api": "opengl",

    // Espaço de cor de saída. false = linear/UNORM (a arte pixel-art já está
    // no espaço certo; sRGB deixaria tudo mais claro).
    "srgb": false,

    // Vsync liga o cap na taxa de atualização do monitor.
    "vsync": true
  }
}
